<html>
    <head>
        <link rel="stylesheet" href="./css/styles.css">
    </head>
    <body>
        <div class="container">
            <button 
                class="buttons" 
                id="newgame"
                onClick="resetScore()">New Game</button>
            <div class="scoreboard">
                <div class="scoreColumn">
                    <h3>HOME</h3>
                    <div class="score" id="homescore">0</div>
                    <div class="buttons">
                        <button 
                            class="buttons" 
                            id="plusone" 
                            onClick="addOneHome()">+1</button> 
                        <button 
                            class="buttons" 
                            id="plustwo" 
                            onClick="addTwoHome()">+2</button> 
                        <button 
                            class="buttons" 
                            id="plusthree" 
                            onClick="addThreeHome()">+3</button> 
                    </div>
                </div>
                <div class="scoreColumn">
                    <h3>GUEST</h3>
                    <div class="score" id="guestscore">0</div>
                    <div class="buttons">
                        <button 
                            class="buttons" 
                            id="plusone" 
                            onClick="addOneGuest()">+1</button> 
                        <button 
                            class="buttons" 
                            id="plustwo" 
                            onClick="addTwoGuest()">+2</button> 
                        <button 
                            class="buttons" 
                            id="plusthree" 
                            onClick="addThreeGuest()">+3</button> 
                    </div>
                </div>
            </div>
        </div>
        <script src="./js/index.js"></script>
    </body>
</html>
