<!doctype html>
<html lang="en">
  
<head>
  <link rel="stylesheet" href="./index.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metic/Imperial Converter</title>
  <!--
  Name: Matt Salvadori
  File: index.html
  Date: Nov 11 2026
  Unit Converter Chrome Extension
  -->
  </head>
  <body>
    <div id="entry">
      <h1>Metric/Imperial Unit Conversion</h1>
      <input id="input-num" type="text" placeholder="0">
      <button id="convert-btn">Convert</button>
    </div>
    <div id="conversion">
      <div class="result-box" id="length-box">
        <h2>Length (Meter/Feet)</h2>
        <p id="length-conversion">&nbsp;</p>
      </div>
      <div class="result-box" id="volume-box">
        <h2>Volume (Liters/Gallons)</h2>
        <p id="volume-conversion">&nbsp;</p>
      </div>
      <div class="result-box" id="mass-box">
        <h2>Mass (Kilograms/Pounds)</h2>
        <p id="mass-conversion">&nbsp;</p>
      </div>
    </div>
  </body>
  <script src="./index.js"></script>
</html>
