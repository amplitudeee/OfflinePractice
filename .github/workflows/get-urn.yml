name: Get LinkedIn URN
on: workflow_dispatch

jobs:
  fetch-urn:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch URN from LinkedIn
        env:
          TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          node -e 'fetch("api.linkedin.com/v2/userinfo", { headers: { Authorization: "Bearer " + process.env.TOKEN } }).then(r => r.json()).then(d => console.log("RESPONSE:", JSON.stringify(d)))'
